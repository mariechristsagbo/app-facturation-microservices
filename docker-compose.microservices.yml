x-service-build: &service-build
  build:
    context: .
    dockerfile: Dockerfile.service
  restart: unless-stopped

services:
  client-service:
    <<: *service-build
    container_name: facturation-client-service
    command: node services/client-service/server.js
    volumes:
      - ./services/client-service/data:/app/services/client-service/data
    networks:
      - proxy
      - facturation-backend

  product-service:
    <<: *service-build
    container_name: facturation-product-service
    command: node services/product-service/server.js
    volumes:
      - ./services/product-service/data:/app/services/product-service/data
    networks:
      - proxy
      - facturation-backend

  order-service:
    <<: *service-build
    container_name: facturation-order-service
    command: node services/order-service/server.js
    environment:
      CLIENT_SERVICE_URL: http://client-service:3002
      PRODUCT_SERVICE_URL: http://product-service:3003
    depends_on:
      - client-service
      - product-service
    volumes:
      - ./services/order-service/data:/app/services/order-service/data
    networks:
      - proxy
      - facturation-backend

  invoice-service:
    <<: *service-build
    container_name: facturation-invoice-service
    command: node services/invoice-service/server.js
    environment:
      ORDER_SERVICE_URL: http://order-service:3005
    depends_on:
      - order-service
    volumes:
      - ./services/invoice-service/data:/app/services/invoice-service/data
    networks:
      - proxy
      - facturation-backend

  reglement-service:
    <<: *service-build
    container_name: facturation-reglement-service
    command: node services/reglement-service/server.js
    environment:
      INVOICE_SERVICE_URL: http://invoice-service:3006
    depends_on:
      - invoice-service
    volumes:
      - ./services/reglement-service/data:/app/services/reglement-service/data
    networks:
      - proxy
      - facturation-backend

  cash-register-service:
    <<: *service-build
    container_name: facturation-cash-register-service
    command: node services/cash-register-service/server.js
    volumes:
      - ./services/cash-register-service/data:/app/services/cash-register-service/data
    networks:
      - proxy
      - facturation-backend

  warehouse-service:
    <<: *service-build
    container_name: facturation-warehouse-service
    command: node services/warehouse-service/server.js
    volumes:
      - ./services/warehouse-service/data:/app/services/warehouse-service/data
    networks:
      - proxy
      - facturation-backend

networks:
  proxy:
    external: true
  facturation-backend:
    driver: bridge
