      - facturation-backend
    labels:
      <<: *api-router
      traefik.http.routers.caisse-api.rule: Host(`${HOST}`) && PathPrefix(`/api/caisse`)
      traefik.http.routers.caisse-api.entrypoints: websecure
      traefik.http.routers.caisse-api.tls: "true"
      traefik.http.routers.caisse-api.priority: "100"
      traefik.http.routers.caisse-api.middlewares: authelia@docker,caisse-strip
      traefik.http.routers.caisse-api.service: caisse-api
      traefik.http.middlewares.caisse-strip.stripprefix.prefixes: /api/caisse
      traefik.http.services.caisse-api.loadbalancer.server.port: "3008"

  warehouse-service:
    <<: *service-build
    container_name: facturation-warehouse-service
    command: node services/warehouse-service/server.js
    volumes:
      - ./services/warehouse-service/data:/app/services/warehouse-service/data
    networks:
      - proxy
      - facturation-backend
    labels:
      <<: *api-router
      traefik.http.routers.entrepot-api.rule: Host(`${HOST}`) && PathPrefix(`/api/entrepot`)
      traefik.http.routers.entrepot-api.entrypoints: websecure
      traefik.http.routers.entrepot-api.tls: "true"
      traefik.http.routers.entrepot-api.priority: "100"
      traefik.http.routers.entrepot-api.middlewares: authelia@docker,entrepot-strip
      traefik.http.routers.entrepot-api.service: entrepot-api
      traefik.http.middlewares.entrepot-strip.stripprefix.prefixes: /api/entrepot
      traefik.http.services.entrepot-api.loadbalancer.server.port: "3009"

networks:
  proxy:
    external: true
  facturation-backend:
    driver: bridge
